server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not leak the server version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API is proxied to the backend service on the internal docker network.
    # The /api prefix is preserved (backend routes are /api/domains, /api/history).
    location /api/ {
        # Resolve the backend through docker's embedded DNS at request time, so
        # nginx starts even if the backend is not up yet and picks up its new IP
        # if the container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:3344;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
