services:
  backend:
    build: ./backend
    container_name: neurai-monitor-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3344
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=domain_monitor
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m" 
        max-file: "5"
        compress: "true" 

  frontend:
    build: ./frontend
    container_name: neurai-monitor-frontend
    # Bound to loopback only: the host's nginx reverse proxy is the sole entry
    # point, so docker must not publish this port on the public interface.
    ports:
      - "127.0.0.1:4321:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"

  db:
    image: postgres:18.1-alpine
    container_name: neurai-monitor-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domain_monitor"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domain_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
